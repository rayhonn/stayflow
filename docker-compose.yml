services:
  postgres:
    image: postgres:18-alpine
    container_name: stayflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayflow}
      POSTGRES_USER: ${POSTGRES_USER:-stayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayflow_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stayflow-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stayflow} -d ${POSTGRES_DB:-stayflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: stayflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - stayflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stayflow-postgres-data:
  stayflow-redis-data:
